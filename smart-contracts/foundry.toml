[profile.default]
src = "src"
out = "out"
libs = ["lib"]
ffi = false 
optimizer = true
optimizer_runs = 200
via_ir = false 
rpc-url = "${MONAD_RPC_URL}"

metadata = true
metadata_hash = "none"  # disable ipfs
use_literal_content = true # store source code in the json file directly


